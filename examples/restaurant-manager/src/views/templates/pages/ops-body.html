<div class="context-bar">
  <div>
    <div class="ctx-label">Account</div>
    <div class="ctx-value">{{accountName}}</div>
  </div>
  <div>
    <div class="ctx-label">Project</div>
    <div class="ctx-value">{{projectId}}</div>
  </div>
  <div>
    <div class="ctx-label">User</div>
    <div class="ctx-value">{{userName}}</div>
  </div>
  <div>
    <div class="ctx-label">Page</div>
    <div class="ctx-value">{{pagePath}}</div>
  </div>
</div>

<div class="card" style="margin-bottom: 16px;">
  <div class="stat-bar">
    <div class="stat">
      <div class="stat-value">{{openOrders}}</div>
      <div class="stat-label">Open Orders</div>
    </div>
    <div class="stat">
      <div class="stat-value">{{readyOrders}}</div>
      <div class="stat-label">Ready</div>
    </div>
    <div class="stat">
      <div class="stat-value">{{revenue}}</div>
      <div class="stat-label">Revenue</div>
    </div>
  </div>
</div>

<div class="card list-section">
  <h2>Menu Items</h2>
  <ul class="stack-list">{{menuItems}}</ul>
</div>
