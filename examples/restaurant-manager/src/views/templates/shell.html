<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}} · Kitchen</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; }

      :root {
        --bg: #f5f5f4;
        --surface: #ffffff;
        --ink: #1c1917;
        --secondary: #57534e;
        --muted: #a8a29e;
        --accent: #059669;
        --accent-hover: #047857;
        --accent-light: #ecfdf5;
        --border: #e7e5e4;
        --border-hover: #d6d3d1;
        --amber: #d97706;
        --amber-light: #fffbeb;
        --red: #dc2626;
        --red-light: #fef2f2;
        --radius: 10px;
      }

      body.theme-dark {
        --bg: #0f172a;
        --surface: #111827;
        --ink: #f8fafc;
        --secondary: #cbd5e1;
        --muted: #94a3b8;
        --accent: #34d399;
        --accent-hover: #10b981;
        --accent-light: rgba(52, 211, 153, 0.16);
        --border: #334155;
        --border-hover: #475569;
        --amber: #fbbf24;
        --amber-light: rgba(251, 191, 36, 0.14);
        --red: #f87171;
        --red-light: rgba(248, 113, 113, 0.14);
      }

      body {
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }

      a { color: inherit; text-decoration: none; }

      /* ── Header ── */
      .app-header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 0 24px;
        height: 56px;
        display: flex;
        align-items: center;
        gap: 32px;
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .logo {
        font-size: 0.938rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .logo-icon {
        width: 24px;
        height: 24px;
        background: var(--accent);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 0.7rem;
        font-weight: 700;
      }

      .header-nav {
        display: flex;
        gap: 4px;
        margin-left: auto;
      }

      .header-nav a {
        font-size: 0.85rem;
        color: var(--secondary);
        padding: 6px 12px;
        border-radius: 6px;
        font-weight: 500;
        transition: background 0.15s, color 0.15s;
      }

      .header-nav a:hover {
        background: var(--bg);
        color: var(--ink);
      }

      /* ── Layout ── */
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 32px 24px 80px;
      }

      .page-head {
        margin-bottom: 24px;
      }

      .page-head h1 {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .page-head p {
        color: var(--secondary);
        font-size: 0.938rem;
        line-height: 1.6;
        margin-top: 4px;
        max-width: 56ch;
      }

      /* ── Cards ── */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        transition: border-color 0.15s;
      }

      .card:hover {
        border-color: var(--border-hover);
      }

      .card-label {
        font-size: 0.68rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }

      .card h2 {
        font-size: 1.05rem;
        font-weight: 600;
        margin-top: 6px;
      }

      .card-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(2, 1fr);
      }

      /* ── Stats ── */
      .stat-bar {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
      }

      .stat {
        display: flex;
        flex-direction: column;
      }

      .stat-value {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1;
      }

      .stat-label {
        font-size: 0.68rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin-top: 4px;
      }

      /* ── Meta ── */
      .meta-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .meta-tag {
        font-size: 0.75rem;
        color: var(--secondary);
        background: var(--bg);
        padding: 3px 8px;
        border-radius: 5px;
      }

      /* ── Buttons ── */
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: background 0.15s;
      }

      .btn-primary {
        background: var(--accent);
        color: white;
      }

      .btn-primary:hover {
        background: var(--accent-hover);
      }

      .btn-secondary {
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--border);
      }

      .btn-secondary:hover {
        border-color: var(--border-hover);
      }

      /* ── Lists ── */
      .list-section h2 {
        font-size: 0.938rem;
        font-weight: 600;
        margin-bottom: 10px;
      }

      .stack-list {
        list-style: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .stack-list li {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        transition: border-color 0.15s;
      }

      .stack-list li:hover {
        border-color: var(--border-hover);
      }

      .item-info {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }

      .item-name {
        font-size: 0.938rem;
        font-weight: 500;
      }

      .item-meta {
        font-size: 0.8rem;
        color: var(--secondary);
      }

      .item-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }

      .item-price {
        font-size: 0.85rem;
        font-weight: 600;
      }

      .badge {
        font-size: 0.68rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        padding: 2px 7px;
        border-radius: 4px;
      }

      .badge-open {
        background: var(--amber-light);
        color: var(--amber);
      }

      .badge-ready {
        background: var(--accent-light);
        color: var(--accent);
      }

      .badge-available {
        background: var(--accent-light);
        color: var(--accent);
      }

      .badge-hidden {
        background: var(--red-light);
        color: var(--red);
      }

      /* ── Context (internal pages) ── */
      .context-bar {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 16px;
        margin-bottom: 24px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }

      .ctx-label {
        font-size: 0.68rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
      }

      .ctx-value {
        font-size: 0.85rem;
        font-weight: 600;
        margin-top: 1px;
      }

      /* ── Two-col ── */
      .two-col {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(2, 1fr);
      }

      /* ── Message ── */
      .message-card {
        text-align: center;
        padding: 48px 24px;
        color: var(--secondary);
      }

      .message-card p {
        font-size: 0.938rem;
        line-height: 1.6;
      }

      /* ── Responsive ── */
      @media (max-width: 700px) {
        .card-grid, .two-col {
          grid-template-columns: 1fr;
        }

        .context-bar {
          grid-template-columns: repeat(2, 1fr);
        }

        .header-nav {
          display: none;
        }
      }
    </style>
  </head>
  <body class="{{themeClass}}">
    <header class="app-header">
      <a href="/" class="logo">
        <div class="logo-icon">K</div>
        Kitchen
      </a>
      <nav class="header-nav">
        <a href="/">Dashboard</a>
      </nav>
    </header>
    <main>
      <div class="page-head">
        <h1>{{title}}</h1>
        <p>{{subtitle}}</p>
      </div>
      {{body}}
    </main>
  </body>
</html>
